openapi: "3.1.0"

info:
  title: "Pociag Data Service API"
  version: "0.3.0"
  description: |
    Internal domain read service.
    Exposes curated schedules, operations, disruptions, and dictionaries.
    Not exposed to frontend directly; consumed by Gateway (BFF) and internal services.

servers:
  - url: http://localhost:8083
    description: Local development

# ── Tags ─────────────────────────────────────────────────────────────────────
tags:
  - name: health
    description: Liveness and readiness probes
  - name: schedules
    description: Train schedule (timetable) domain queries
  - name: operations
    description: Train operation execution domain queries
  - name: disruptions
    description: Traffic disruption domain queries
  - name: dictionaries
    description: Reference data queries (stations, carriers, etc.)

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      tags: [health]
      responses:
        "200":
          description: Service is alive

  /readyz:
    get:
      summary: Readiness probe
      operationId: readyz
      tags: [health]
      responses:
        "200":
          description: Service is ready to accept traffic
        "503":
          description: Service is not ready

  # ── Schedules ──────────────────────────────────────────────────────────────

  /api/v1/schedules:
    get:
      summary: Query routes by filters
      description: Returns paginated routes matching the given criteria.
      operationId: queryRoutes
      tags: [schedules]
      parameters:
        - name: dateFrom
          in: query
          description: Filter routes operating on or after this date
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Filter routes operating on or before this date
          schema:
            type: string
            format: date
        - name: stationExternalIds
          in: query
          description: Comma-separated station external IDs (any-match)
          schema:
            type: string
        - name: fromCity
          in: query
          description: Origin city name (requires toCity)
          schema:
            type: string
        - name: toCity
          in: query
          description: Destination city name (requires fromCity)
          schema:
            type: string
        - name: carrierCodes
          in: query
          description: Comma-separated carrier codes filter
          schema:
            type: string
        - name: commercialCategory
          in: query
          description: Filter by commercial category symbol (e.g. IC, TLK, REG)
          schema:
            type: string
        - name: name
          in: query
          description: Search by train name (partial match)
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated route list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/schedules/{routeId}:
    get:
      summary: Get route by internal ID
      description: Returns full route with stations, operating dates, and connections.
      operationId: getRouteById
      tags: [schedules]
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Full route details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedules/by-key/{scheduleId}/{orderId}:
    get:
      summary: Get route by PLK natural key
      description: Looks up a route by its PLK (schedule_id, order_id) pair.
      operationId: getRouteByKey
      tags: [schedules]
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full route details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedules/{routeId}/stations:
    get:
      summary: Get stations for a route
      description: Returns ordered list of stops for a given route.
      operationId: getRouteStations
      tags: [schedules]
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Ordered station list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteStationListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedules/{routeId}/operating-dates:
    get:
      summary: Get operating dates for a route
      description: Returns all dates when this route operates.
      operationId: getRouteOperatingDates
      tags: [schedules]
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          description: Filter dates from (inclusive)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Filter dates to (inclusive)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of operating dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingDatesResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Operations ─────────────────────────────────────────────────────────────

  /api/v1/operations:
    get:
      summary: Query train operations
      description: Returns paginated train operations matching filters.
      operationId: queryOperations
      tags: [operations]
      parameters:
        - name: date
          in: query
          description: Operating date (defaults to today)
          schema:
            type: string
            format: date
        - name: stationExternalIds
          in: query
          description: Comma-separated station external IDs
          schema:
            type: string
        - name: status
          in: query
          description: Train status filter
          schema:
            type: string
            enum: [S, P, C, X, Q]
        - name: carrierCodes
          in: query
          description: Comma-separated carrier codes
          schema:
            type: string
        - name: minDelay
          in: query
          description: Minimum delay in minutes (filters trains with delay >= this value)
          schema:
            type: integer
        - name: activeOnly
          in: query
          description: >-
            When true, return only operations with status P whose expected end (last stop's
            actual arrival, else planned arrival + arrival delay, else planned arrival/departure)
            is not earlier than now minus 30 minutes; when `date` is also given, the previous
            operating date is included to cover overnight trains.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated operations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/operations/{operationId}:
    get:
      summary: Get operation by internal ID
      description: Returns full operation details with all station stops.
      operationId: getOperationById
      tags: [operations]
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Full operation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/operations/statistics:
    get:
      summary: Get operation statistics for a date
      description: Returns aggregated status counts and delay distribution.
      operationId: getOperationStatistics
      tags: [operations]
      parameters:
        - name: date
          in: query
          description: Date for statistics (defaults to today)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationStatistics"

  /api/v1/operations/active:
    get:
      summary: List active trains with estimated positions
      description: |
        Returns the trains running at the reference instant `at`, each with its phase,
        surrounding stops and an estimated position.

        Effective times: for each non-cancelled stop, ordered by actual sequence number, the
        effective arrival is the actual arrival, else the planned arrival + the last known
        delay; the effective departure follows the same rule. On a confirmed stop the actual
        time is observed; on an unconfirmed stop it is PLK's forecast. The first stop uses its
        departure and the last stop its arrival. A stop with neither time is skipped.

        Active predicate (all must hold): (1) train_status = 'P', or train_status = 'S' once
        `at` >= effective departure of the first stop; status 'Q' and every other status are
        excluded, so `train_status` is always S or P; (2) operating_date is the Europe/Warsaw
        date of `at` or the day before; (3) the operation was seen in a recent snapshot:
        updated_at >= MAX(train_operations.updated_at) - 15 minutes; (4) effective departure
        of the first stop - 5 minutes <= `at` <= effective arrival of the last stop (no
        post-arrival grace period).

        Because of (4) the list never contains phase `arrived`. That value stays in the enum
        for consumers that share the ActiveTrain model (station board, train detail). Entries
        are ordered by operation_id and truncated to `limit`; `total` counts all active trains
        that match the filters.
      operationId: listActiveOperations
      tags: [operations]
      parameters:
        - name: at
          in: query
          description: Reference instant (RFC 3339); defaults to the current time
          schema:
            type: string
            format: date-time
        - name: carrierCodes
          in: query
          description: Comma-separated carrier codes
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of trains to return
          schema:
            type: integer
            default: 2000
            minimum: 1
            maximum: 5000
      responses:
        "200":
          description: Active trains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTrainListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Disruptions ────────────────────────────────────────────────────────────

  /api/v1/disruptions:
    get:
      summary: Query disruptions
      description: Returns paginated disruptions matching filters.
      operationId: queryDisruptions
      tags: [disruptions]
      parameters:
        - name: dateFrom
          in: query
          description: Disruptions active on or after this date
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Disruptions active on or before this date
          schema:
            type: string
            format: date
        - name: stationExternalIds
          in: query
          description: Filter by station IDs (start or end station matches)
          schema:
            type: string
        - name: typeCode
          in: query
          description: Filter by disruption type code
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated disruption list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisruptionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/disruptions/{disruptionId}:
    get:
      summary: Get disruption by internal ID
      description: Returns full disruption with affected routes.
      operationId: getDisruptionById
      tags: [disruptions]
      parameters:
        - name: disruptionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Full disruption details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisruptionDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Dictionaries ───────────────────────────────────────────────────────────

  /api/v1/stations:
    get:
      summary: Query stations
      description: Returns stations with optional search and pagination.
      operationId: queryStations
      tags: [dictionaries]
      parameters:
        - name: search
          in: query
          description: Search by name prefix (trigram, case-insensitive)
          schema:
            type: string
        - name: city
          in: query
          description: Filter by city
          schema:
            type: string
        - name: externalIds
          in: query
          description: Comma-separated external IDs to fetch
          schema:
            type: string
        - name: hasCoordinates
          in: query
          description: When true, only return stations that have geographic coordinates
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Station list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationListResponse"

  /api/v1/stations/{externalId}:
    get:
      summary: Get station by external ID
      operationId: getStationByExternalId
      tags: [dictionaries]
      parameters:
        - name: externalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Station details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stations/{externalId}/board:
    get:
      summary: Get station board (arrivals, departures, at station)
      description: >-
        Returns the station board for the reference instant `at`. For each stop at the station
        whose operation is not fully cancelled (train_status <> 'X'), the expected arrival /
        departure is actual, else planned + delay, else planned. Stops are bucketed into
        `at_station` (not cancelled, arrived at or before `at`, and either expected to depart
        after `at` or a terminus arrival within the last 5 minutes), `arrival` (expected
        arrival in (at, at + horizonMinutes]) and `departure` (expected departure in
        (at, at + horizonMinutes], not in `at_station`). A through train yields both an
        `arrival` and a `departure` entry. Cancelled stops stay in `arrival` / `departure`
        and count toward `limit`. Each bucket is ordered by board time (expected arrival for
        `arrival`, expected departure otherwise) and truncated to `limit`. Only stops whose
        planned departure (else planned arrival) lies in [at - lookbackMinutes,
        at + horizonMinutes] are considered.
      operationId: getStationBoard
      tags: [operations]
      parameters:
        - name: externalId
          in: path
          required: true
          schema:
            type: integer
        - name: at
          in: query
          description: Reference instant (RFC 3339); defaults to the current time
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of entries per bucket
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: horizonMinutes
          in: query
          description: How far ahead of `at` to look for trains, in minutes
          schema:
            type: integer
            default: 720
            minimum: 30
            maximum: 1440
        - name: lookbackMinutes
          in: query
          description: >-
            How far before `at` to read stops by planned time, in minutes (covers delayed
            trains)
          schema:
            type: integer
            default: 360
            minimum: 0
            maximum: 720
      responses:
        "200":
          description: Station board entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationBoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/carriers:
    get:
      summary: List all carriers
      operationId: listCarriers
      tags: [dictionaries]
      responses:
        "200":
          description: All carriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierListResponse"

  /api/v1/commercial-categories:
    get:
      summary: List all commercial categories
      operationId: listCommercialCategories
      tags: [dictionaries]
      responses:
        "200":
          description: All commercial categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialCategoryListResponse"

  /api/v1/stop-types:
    get:
      summary: List all stop types
      operationId: listStopTypes
      tags: [dictionaries]
      responses:
        "200":
          description: All stop types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopTypeListResponse"

# ── Components ───────────────────────────────────────────────────────────────
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000

    Offset:
      name: offset
      in: query
      description: Number of items to skip
      schema:
        type: integer
        default: 0
        minimum: 0

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Common ─────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
        trace_id:
          type: string

    Pagination:
      type: object
      required: [total, limit, offset]
      additionalProperties: false
      properties:
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    # ── Dictionaries ───────────────────────────────────────────────────────────
    Station:
      type: object
      required: [id, external_id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        external_id:
          type: integer
        name:
          type: string
        city:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    StationListResponse:
      type: object
      required: [data, pagination]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Station"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Carrier:
      type: object
      required: [id, code, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time

    CarrierListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Carrier"

    CommercialCategory:
      type: object
      required: [id, code, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        carrier_code:
          type: string
        speed_category_code:
          type: string

    CommercialCategoryListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CommercialCategory"

    StopType:
      type: object
      required: [id, external_id, description]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        external_id:
          type: integer
        description:
          type: string

    StopTypeListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StopType"

    # ── Schedules ──────────────────────────────────────────────────────────────
    RouteSummary:
      type: object
      required: [id, schedule_id, order_id]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        schedule_id:
          type: integer
        order_id:
          type: integer
        train_order_id:
          type: integer
        name:
          type: string
        carrier_code:
          type: string
        national_number:
          type: string
        commercial_category_symbol:
          type: string
        first_station_name:
          type: string
        last_station_name:
          type: string
        first_departure_time:
          type: string
          description: "HH:MM format"
        last_arrival_time:
          type: string
          description: "HH:MM format"
        station_count:
          type: integer
        operating_dates_count:
          type: integer

    RouteListResponse:
      type: object
      required: [data, pagination]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RouteSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    RouteStation:
      type: object
      required: [station_external_id, order_number]
      additionalProperties: false
      properties:
        station_external_id:
          type: integer
        station_name:
          type: string
        order_number:
          type: integer
        arrival_time:
          type: string
          description: "ISO 8601 duration or HH:MM"
        departure_time:
          type: string
          description: "ISO 8601 duration or HH:MM"
        arrival_day:
          type: integer
        departure_day:
          type: integer
        platform:
          type: string
        track:
          type: string
        stop_type:
          type: string
        commercial_category:
          type: string

    RouteStationListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RouteStation"

    OperatingDatesResponse:
      type: object
      required: [route_id, dates]
      additionalProperties: false
      properties:
        route_id:
          type: integer
          format: int64
        dates:
          type: array
          items:
            type: string
            format: date

    RouteConnection:
      type: object
      required: [type_code, station_external_id]
      additionalProperties: false
      properties:
        external_connection_id:
          type: string
        type_code:
          type: string
        type_name:
          type: string
        station_external_id:
          type: integer
        station_name:
          type: string
        wagon_numbers:
          type: string
        train1_order_id:
          type: integer
        train2_order_id:
          type: integer

    RouteDetail:
      type: object
      required: [id, schedule_id, order_id, stations, operating_dates]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        schedule_id:
          type: integer
        order_id:
          type: integer
        train_order_id:
          type: integer
        name:
          type: string
        carrier_code:
          type: string
        national_number:
          type: string
        international_arrival_num:
          type: string
        international_departure_num:
          type: string
        commercial_category_symbol:
          type: string
        stations:
          type: array
          items:
            $ref: "#/components/schemas/RouteStation"
        operating_dates:
          type: array
          items:
            type: string
            format: date
        connections:
          type: array
          items:
            $ref: "#/components/schemas/RouteConnection"

    # ── Operations ─────────────────────────────────────────────────────────────
    OperationSummary:
      type: object
      required: [id, schedule_id, order_id, operating_date, train_status]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        schedule_id:
          type: integer
        order_id:
          type: integer
        train_order_id:
          type: integer
        operating_date:
          type: string
          format: date
        train_status:
          type: string
        route_name:
          type: string
          description: Resolved from routes table
        carrier_code:
          type: string
        max_arrival_delay_minutes:
          type: integer
        max_departure_delay_minutes:
          type: integer
        station_count:
          type: integer

    OperationListResponse:
      type: object
      required: [data, pagination]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperationSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    OperationStation:
      type: object
      required:
        [
          station_external_id,
          actual_sequence_number,
          is_confirmed,
          is_cancelled,
        ]
      additionalProperties: false
      properties:
        station_external_id:
          type: integer
        station_name:
          type: string
        planned_sequence_number:
          type: integer
        actual_sequence_number:
          type: integer
        planned_arrival:
          type: string
          format: date-time
          description: UTC instant (PLK naive values are interpreted as Europe/Warsaw local time)
        planned_departure:
          type: string
          format: date-time
          description: UTC instant (PLK naive values are interpreted as Europe/Warsaw local time)
        actual_arrival:
          type: string
          format: date-time
          description: UTC instant (PLK naive values are interpreted as Europe/Warsaw local time)
        actual_departure:
          type: string
          format: date-time
          description: UTC instant (PLK naive values are interpreted as Europe/Warsaw local time)
        arrival_delay_minutes:
          type: integer
        departure_delay_minutes:
          type: integer
        is_confirmed:
          type: boolean
        is_cancelled:
          type: boolean

    OperationDetail:
      type: object
      required:
        [id, schedule_id, order_id, operating_date, train_status, stations]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        schedule_id:
          type: integer
        order_id:
          type: integer
        train_order_id:
          type: integer
        operating_date:
          type: string
          format: date
        train_status:
          type: string
        route_name:
          type: string
        carrier_code:
          type: string
        stations:
          type: array
          items:
            $ref: "#/components/schemas/OperationStation"

    OperationStatistics:
      type: object
      required: [date, total, by_status, delay_distribution]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        total:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
          description: "Map of status code to count"
        delay_distribution:
          type: object
          additionalProperties: false
          properties:
            on_time:
              type: integer
              description: Trains with max delay <= 5 min
            slight_delay:
              type: integer
              description: Trains with max delay 6-15 min
            moderate_delay:
              type: integer
              description: Trains with max delay 16-60 min
            severe_delay:
              type: integer
              description: Trains with max delay > 60 min
        avg_delay_minutes:
          type: number
          format: float
        last_updated_at:
          type: string
          format: date-time
          description: >-
            MAX(train_operations.updated_at) for the requested date: when operations for this
            date were last refreshed from PLK

    StationBoardEntry:
      type: object
      required:
        [
          operation_id,
          schedule_id,
          order_id,
          operating_date,
          train_status,
          sequence_number,
          bucket,
          is_confirmed,
          is_cancelled,
        ]
      additionalProperties: false
      properties:
        bucket:
          type: string
          enum: [at_station, arrival, departure]
        operation_id:
          type: integer
          format: int64
        schedule_id:
          type: integer
        order_id:
          type: integer
        train_order_id:
          type: integer
        operating_date:
          type: string
          format: date
        train_status:
          type: string
        sequence_number:
          type: integer
          description: Actual sequence number of this stop within the operation
        route_id:
          type: integer
          format: int64
          description: Omitted when the route is missing from the routes table
        route_name:
          type: string
        carrier_code:
          type: string
        commercial_category:
          type: string
        national_number:
          type: string
        train_number:
          type: string
          description: Route stop departure train number, else arrival train number
        arrival_platform:
          type: string
        arrival_track:
          type: string
        departure_platform:
          type: string
        departure_track:
          type: string
        planned_arrival:
          type: string
          format: date-time
          description: UTC instant (PLK naive values are interpreted as Europe/Warsaw local time)
        planned_departure:
          type: string
          format: date-time
          description: UTC instant (PLK naive values are interpreted as Europe/Warsaw local time)
        expected_arrival:
          type: string
          format: date-time
          description: Actual arrival, else planned arrival + arrival delay, else planned arrival
        expected_departure:
          type: string
          format: date-time
          description: >-
            Actual departure, else planned departure + departure delay, else planned departure
        arrival_delay_minutes:
          type: integer
        departure_delay_minutes:
          type: integer
        is_confirmed:
          type: boolean
        is_cancelled:
          type: boolean
        origin_station_external_id:
          type: integer
        origin_station_name:
          type: string
        destination_station_external_id:
          type: integer
        destination_station_name:
          type: string

    StationBoardResponse:
      type: object
      required: [station_external_id, at, limit, horizon_minutes, entries]
      additionalProperties: false
      properties:
        station_external_id:
          type: integer
        at:
          type: string
          format: date-time
          description: The reference instant actually used
        limit:
          type: integer
          description: Per-bucket limit actually used
        horizon_minutes:
          type: integer
        data_as_of:
          type: string
          format: date-time
          description: >-
            MAX(train_operations.updated_at) over the returned operations; omitted when there
            are no entries
        entries:
          type: array
          description: Bucketed entries, truncated per bucket, ordered by board time
          items:
            $ref: "#/components/schemas/StationBoardEntry"

    StopRef:
      type: object
      required: [station_external_id]
      additionalProperties: false
      properties:
        station_external_id:
          type: integer
        station_name:
          type: string
          description: Omitted when the station is missing from the stations table

    StopTiming:
      type: object
      required: [station_external_id, sequence_number, time, is_confirmed]
      additionalProperties: false
      properties:
        station_external_id:
          type: integer
        station_name:
          type: string
          description: Omitted when the station is missing from the stations table
        sequence_number:
          type: integer
          description: Actual sequence number of this stop within the operation
        time:
          type: string
          format: date-time
          description: >-
            Effective time (UTC instant) at this stop; which one (arrival or departure) is
            stated by the referencing property
        is_confirmed:
          type: boolean
          description: Whether PLK confirmed the stop (time observed rather than forecast)
        latitude:
          type: number
          format: double
          description: Omitted when the station has no coordinates
        longitude:
          type: number
          format: double
          description: Omitted when the station has no coordinates

    TrainPosition:
      type: object
      required: [latitude, longitude, progress, method]
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            (at - departure(A)) / (arrival(B) - departure(A)) between anchors A and B, clamped
            to [0, 1]; 0 when the position is a station
        method:
          type: string
          enum: [station, interpolated, interpolated_sparse]
          description: >-
            station: at a stop with coordinates; interpolated: between adjacent stops;
            interpolated_sparse: between the nearest stops with coordinates, which are not
            adjacent. When no anchor has coordinates the parent omits `position`.

    ActiveTrain:
      type: object
      required:
        [
          operation_id,
          schedule_id,
          order_id,
          operating_date,
          train_status,
          phase,
          confidence,
        ]
      additionalProperties: false
      properties:
        operation_id:
          type: integer
          format: int64
        schedule_id:
          type: integer
        order_id:
          type: integer
        operating_date:
          type: string
          format: date
        train_status:
          type: string
          enum: [S, P]
          description: Only S and P pass the active predicate (see listActiveOperations)
        route_name:
          type: string
          description: Omitted when the route is missing from the routes table
        carrier_code:
          type: string
          description: Omitted when the route is missing from the routes table
        origin:
          $ref: "#/components/schemas/StopRef"
        destination:
          $ref: "#/components/schemas/StopRef"
        phase:
          type: string
          enum: [not_departed, at_station, en_route, arrived]
          description: >-
            Phase at `at`. `arrived` (after the effective arrival at the last stop) is never
            returned by listActiveOperations, which has no post-arrival grace period; it is
            kept for other consumers of this model.
        previous_stop:
          $ref: "#/components/schemas/StopTiming"
          description: >-
            Segment start: the stop the train is at or last departed from (anchor A when the
            position is interpolated); `time` is its effective departure. The first stop in
            phase not_departed. Omitted when unknown.
        next_stop:
          $ref: "#/components/schemas/StopTiming"
          description: >-
            Segment end: the next stop ahead (anchor B when the position is interpolated);
            `time` is its effective arrival. Omitted at the last stop.
        last_confirmed_stop:
          $ref: "#/components/schemas/StopTiming"
          description: >-
            Last stop PLK confirmed; `time` is its effective departure, else effective
            arrival. Omitted when no stop is confirmed.
        delay_minutes:
          type: integer
          description: >-
            Delay at the last confirmed stop (departure, else arrival); negative when early.
            Omitted when no stop is confirmed.
        position:
          $ref: "#/components/schemas/TrainPosition"
          description: Estimated position at `at`; omitted when no anchor stop has coordinates
        confidence:
          type: string
          enum: [high, medium, low]
          description: >-
            high: snapshot under 15 min old and last confirmation under 20 min old; medium:
            snapshot under 30 min old; low: otherwise
        last_seen_at:
          type: string
          format: date-time
          description: train_operations.updated_at of this operation

    ActiveTrainListResponse:
      type: object
      required: [data, generated_at, data_as_of]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActiveTrain"
        total:
          type: integer
          description: Number of active trains matching the filters, before `limit`
        generated_at:
          type: string
          format: date-time
          description: >-
            Time the response was generated (server clock); positions are evaluated at `at`,
            which defaults to this time
        data_as_of:
          type: string
          format: date-time
          description: >-
            MAX(train_operations.updated_at): when operations were last refreshed from PLK

    # ── Disruptions ────────────────────────────────────────────────────────────
    DisruptionSummary:
      type: object
      required: [id, external_disruption_id]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        external_disruption_id:
          type: integer
          format: int64
        disruption_type_code:
          type: string
        disruption_type_name:
          type: string
        start_station_ext_id:
          type: integer
        start_station_name:
          type: string
        end_station_ext_id:
          type: integer
        end_station_name:
          type: string
        message:
          type: string
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        affected_routes_count:
          type: integer

    DisruptionListResponse:
      type: object
      required: [data, pagination]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DisruptionSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    DisruptionAffectedRoute:
      type: object
      required: [schedule_id, order_id]
      additionalProperties: false
      properties:
        schedule_id:
          type: integer
        order_id:
          type: integer
        train_order_id:
          type: integer
        operating_date:
          type: string
          format: date
        station_ext_id:
          type: integer
        station_name:
          type: string
        sequence_number:
          type: integer

    DisruptionDetail:
      type: object
      required: [id, external_disruption_id, affected_routes]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        external_disruption_id:
          type: integer
          format: int64
        disruption_type_code:
          type: string
        disruption_type_name:
          type: string
        start_station_ext_id:
          type: integer
        start_station_name:
          type: string
        end_station_ext_id:
          type: integer
        end_station_name:
          type: string
        message:
          type: string
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        affected_routes:
          type: array
          items:
            $ref: "#/components/schemas/DisruptionAffectedRoute"
