name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pociag
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pociag_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pociag" --health-interval 5s --health-retries 10
    env:
      POCIAG_TEST_DATABASE_URL: postgres://pociag:test@localhost:5432/pociag_test
    defaults:
      run:
        working-directory: services/go/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go/api/go.mod
          cache-dependency-path: services/go/api/go.sum

      - name: Test
        run: go test -race -v ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m ./...

  airflow:
    name: Python (airflow)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pociag
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pociag_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pociag" --health-interval 5s --health-retries 10
    env:
      POCIAG_TEST_DATABASE_URL: postgresql://pociag:test@localhost:5432/pociag_test
    defaults:
      run:
        working-directory: airflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install -e plugins

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy plugins/pociag_processing dags

      - name: Test (pytest)
        run: uv run pytest tests/ -v

  build-placeholder:
    name: Build Placeholder
    runs-on: ubuntu-latest
    needs:
      - api
      - airflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build placeholder
        run: |
          echo "Build stage placeholder."
          echo "TODO: Add container/image build steps when build strategy is finalized."

  deploy-placeholder:
    name: Deploy Placeholder (no deployment yet)
    runs-on: ubuntu-latest
    needs:
      - build-placeholder
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: staging
    steps:
      - name: Deployment placeholder
        run: |
          echo "No deployment configured yet."
          echo "TODO: Add deployment steps (e.g., Helm/Terraform/SSH) in a future iteration."
