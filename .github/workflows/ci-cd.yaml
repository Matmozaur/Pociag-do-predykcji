name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer merge must not cancel a production deploy halfway through.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  api:
    name: Go (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pociag
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pociag_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pociag" --health-interval 5s --health-retries 10
    env:
      POCIAG_TEST_DATABASE_URL: postgres://pociag:test@localhost:5432/pociag_test
    defaults:
      run:
        working-directory: services/go/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go/api/go.mod
          cache-dependency-path: services/go/api/go.sum

      - name: Test
        run: go test -race -v ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m ./...

  airflow:
    name: Python (airflow)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pociag
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pociag_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pociag" --health-interval 5s --health-retries 10
    env:
      POCIAG_TEST_DATABASE_URL: postgresql://pociag:test@localhost:5432/pociag_test
    defaults:
      run:
        working-directory: airflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install -e plugins

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy plugins/pociag_processing dags

      - name: Test (pytest)
        run: uv run pytest tests/ -v

  frontend:
    name: Next.js (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type check + lint)
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    # On main the deploy job builds and pushes these images instead.
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - api
      - airflow
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build api image
        run: docker build -t pociag-api:ci services/go/api

      - name: Build frontend image
        run: docker build -t pociag-frontend:ci services/frontend

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - api
      - airflow
      - frontend
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          build_push() {
            # ECR tags are immutable, so re-running a job must not push the same tag again.
            if aws ecr describe-images --repository-name "pociag-$1" --image-ids imageTag="$SHA" > /dev/null 2>&1; then
              echo "pociag-$1:$SHA already exists"
              return
            fi
            docker build -t "$REGISTRY/pociag-$1:$SHA" "$2"
            docker push "$REGISTRY/pociag-$1:$SHA"
          }
          build_push api services/go/api
          build_push frontend services/frontend

      - name: Deploy through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PROD_URL: ${{ vars.PROD_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash infra/ci-deploy.sh
