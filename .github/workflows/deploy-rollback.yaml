name: Roll back production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA from main to redeploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Redeploy an earlier commit
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PROD_URL: ${{ vars.PROD_URL }}
          IMAGE_TAG: ${{ inputs.sha }}
        run: bash infra/ci-deploy.sh
