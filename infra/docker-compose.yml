name: pociag

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Shared by every Airflow container. Connections are defined here, not in the Airflow DB:
# pociag_postgres (curated database) and pociag_plk (PLK Open Data API base URL + key).
x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
  AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8090
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
  AIRFLOW_CONN_POCIAG_POSTGRES: '{"conn_type": "postgres", "host": "postgres", "port": 5432, "login": "pociag", "password": "${POSTGRES_PASSWORD}", "schema": "pociag"}'
  AIRFLOW_CONN_POCIAG_PLK: '{"conn_type": "http", "host": "${PLK_BASE_URL:?Set PLK_BASE_URL in infra/.env}", "password": "${PLK_API_KEY:?Set PLK_API_KEY in infra/.env}"}'
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pociag
      POSTGRES_USER: pociag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5434:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pociag -d pociag]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db/migrations:/migrations:ro
    command: -path /migrations -database postgres://pociag:${POSTGRES_PASSWORD}@postgres:5432/pociag?sslmode=disable up
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - 4327:4317
      - 4328:4318
      - 8889:8889
    logging: *logging

  api:
    build:
      context: ../services/go/api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      HTTP_ADDR: :8080
      DATABASE_DSN: postgres://pociag:${POSTGRES_PASSWORD}@postgres:5432/pociag?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - 8080:8080
    networks:
      - default
      - web
    logging: *logging

  frontend:
    profiles: [frontend, all]
    build:
      context: ../services/frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_URL: http://api:8080
      NODE_ENV: production
    ports:
      - ${FRONTEND_PORT:-3100}:3000
    networks:
      - web
    logging: *logging

  airflow-db:
    image: postgres:16-alpine
    profiles: [airflow, all]
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports:
      - 5433:5432
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U airflow -d airflow]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  airflow-init:
    image: apache/airflow:2.10.4
    profiles: [airflow, all]
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --role Admin \
          --firstname Admin --lastname User --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    image: apache/airflow:2.10.4
    profiles: [airflow, all]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../airflow/plugins:/opt/airflow/plugins:ro
      - airflow_logs:/opt/airflow/logs
    ports:
      - 8090:8080
    command: webserver
    logging: *logging

  airflow-scheduler:
    image: apache/airflow:2.10.4
    profiles: [airflow, all]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../airflow/plugins:/opt/airflow/plugins:ro
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    logging: *logging

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    profiles: [tracing, all]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - 16686:16686
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring, all]
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring, all]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - 3001:3000
    depends_on:
      - prometheus
    logging: *logging

volumes:
  postgres_data:
  airflow_db_data:
  airflow_logs:
  prometheus_data:
  grafana_data:

networks:
  web:
    driver: bridge
