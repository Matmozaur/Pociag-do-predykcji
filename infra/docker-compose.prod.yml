# Production overrides, used by infra/deploy.sh on the EC2 host.
# Only Caddy is public. Admin UIs bind to localhost and are reached through an SSM tunnel.
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [frontend]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in infra/.env}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  api:
    build: !reset null
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in infra/.env}/pociag-api:${IMAGE_TAG:?Set IMAGE_TAG in infra/.env}
    ports: !reset []
  predictor:
    build: !reset null
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in infra/.env}/pociag-predictor:${IMAGE_TAG:?Set IMAGE_TAG in infra/.env}
  frontend:
    build: !reset null
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in infra/.env}/pociag-frontend:${IMAGE_TAG:?Set IMAGE_TAG in infra/.env}
    ports: !reset []
  otel-collector:
    ports: !reset []
  airflow-webserver:
    ports: !override
      - 127.0.0.1:8090:8080
  jaeger:
    environment:
      MEMORY_MAX_TRACES: '50000'
    ports: !override
      - 127.0.0.1:16686:16686
  prometheus:
    ports: !override
      - 127.0.0.1:9090:9090
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infra/.env}
    ports: !override
      - 127.0.0.1:3001:3000

volumes:
  caddy_data:
  caddy_config:
